<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG card source — Wish_Acknowledgement.VR</title>
<!--
  1200 × 630 link-preview card, rendered to assets/img/og-cover.png by
  tools/build-images.js. Kept in the design language of the site itself
  (same palette / type / grid) so a pasted link looks like the real thing.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    position: relative;
    background: #05030f;
    color: #eaf2ff;
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 52px 60px;
  }

  /* ── background layers ─────────────────────────────────────────────── */
  .grid {
    position: absolute; inset: -60px;
    background-image:
      linear-gradient(rgba(78, 130, 255, .10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(78, 130, 255, .10) 1px, transparent 1px);
    background-size: 60px 60px, 60px 60px;
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 20%, transparent 85%);
            mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 20%, transparent 85%);
  }
  .glow {
    position: absolute; inset: -30%;
    background:
      radial-gradient(40% 44% at 16% 20%, rgba(39, 230, 255, .30), transparent 62%),
      radial-gradient(38% 40% at 86% 16%, rgba(255, 47, 208, .26), transparent 64%),
      radial-gradient(46% 46% at 72% 96%, rgba(124, 92, 255, .32), transparent 66%),
      radial-gradient(34% 36% at 24% 92%, rgba(43, 107, 255, .26), transparent 68%);
    filter: blur(14px) saturate(120%);
  }
  .vignette {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 120% 92% at 50% 50%, transparent 42%, rgba(2, 1, 8, .72) 100%),
      linear-gradient(to bottom, rgba(3, 2, 10, .55), transparent 26%, transparent 72%, rgba(3, 2, 10, .68));
  }
  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(190, 225, 255, .05) 0 1px, transparent 1px 3px);
    opacity: .6;
  }
  .frame {
    position: absolute; inset: 26px;
    border: 1px solid rgba(126, 170, 255, .18);
    border-radius: 26px;
  }
  .frame::before, .frame::after {
    content: ""; position: absolute; width: 18px; height: 18px;
    border: 1px solid rgba(127, 243, 255, .6);
  }
  .frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
  .frame::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }

  .layer { position: relative; z-index: 2; }

  /* ── header ────────────────────────────────────────────────────────── */
  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand svg { width: 44px; height: 44px; }
  .brand-name {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 21px; font-weight: 600; letter-spacing: .14em;
  }
  .brand-name b {
    font-weight: 700;
    background: linear-gradient(100deg, #27e6ff, #7c5cff 48%, #ff2fd0);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
  }
  .live {
    display: flex; align-items: center; gap: 9px;
    font-size: 14px; letter-spacing: .22em; color: #4df0b0;
  }
  .live i {
    width: 9px; height: 9px; border-radius: 50%;
    background: #4df0b0; box-shadow: 0 0 14px #4df0b0;
  }

  /* ── centre ────────────────────────────────────────────────────────── */
  .centre { display: grid; gap: 22px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 12px; width: max-content;
    padding: 9px 20px; border-radius: 999px;
    border: 1px solid rgba(39, 230, 255, .38);
    background: linear-gradient(120deg, rgba(39, 230, 255, .16), rgba(255, 47, 208, .14));
    font-size: 14px; letter-spacing: .3em; color: #7ff3ff;
  }
  .eyebrow i { width: 8px; height: 8px; border-radius: 50%; background: #27e6ff; box-shadow: 0 0 12px #27e6ff; }

  h1 {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 74px; font-weight: 700; line-height: 1.02; letter-spacing: -.01em;
    background: linear-gradient(102deg, #ffffff 0%, #a9f6ff 28%, #b39dff 58%, #ff8ad4 80%, #ffffff 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
  }
  .sub { font-size: 21px; letter-spacing: .1em; color: #9aa8d0; }
  .sub b { color: #eaf2ff; font-weight: 500; }

  /* ── footer ────────────────────────────────────────────────────────── */
  footer { display: flex; align-items: flex-end; justify-content: space-between; }
  .signature { display: grid; gap: 8px; }
  .signature span:first-child { font-size: 12.5px; letter-spacing: .3em; color: #7f8cba; }
  .signature span:last-child {
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 30px; font-weight: 700;
    background: linear-gradient(100deg, #ffffff, #a9f6ff 40%, #ff9ad8);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
  }
  .cta {
    display: flex; align-items: center; gap: 14px;
    padding: 20px 34px; border-radius: 18px;
    border: 1px solid rgba(39, 230, 255, .5);
    background: linear-gradient(140deg, rgba(39, 230, 255, .22), rgba(124, 92, 255, .2) 50%, rgba(255, 47, 208, .22));
    box-shadow: 0 20px 60px -22px rgba(39, 230, 255, .85);
    font-family: "Space Grotesk", system-ui, sans-serif;
    font-size: 25px; font-weight: 700; letter-spacing: .16em;
    white-space: nowrap;
  }
  .cta span:last-child { color: #7ff3ff; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="frame"></div>

  <header class="layer">
    <div class="brand">
      <svg viewBox="0 0 160 160" aria-hidden="true">
        <circle cx="80" cy="80" r="70" fill="none" stroke="#27e6ff" stroke-width="3" stroke-dasharray="9 15" opacity=".7" />
        <circle cx="80" cy="80" r="48" fill="none" stroke="#7c5cff" stroke-width="3" />
        <path d="M80 24 L130 52 V108 L80 136 L30 108 V52 Z" fill="none" stroke="#ff2fd0" stroke-width="4" stroke-linejoin="round" />
        <text x="80" y="94" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="40" font-weight="700" fill="#7ff3ff">VR</text>
      </svg>
      <span class="brand-name">VR <b>DEVELOPMENTS</b></span>
    </div>
    <span class="live"><i></i>SYSTEM ONLINE</span>
  </header>

  <section class="centre layer">
    <span class="eyebrow"><i></i>INCOMING WISH DETECTED</span>
    <h1>Wish_Acknowledgement.VR</h1>
    <p class="sub">Birthday response terminal · <b>sender identified from the link</b></p>
  </section>

  <footer class="layer">
    <div class="signature">
      <span>SIGNED BY</span>
      <span>Volam Rakshith</span>
    </div>
    <div class="cta"><span>ACKNOWLEDGE WISH</span><span>▸</span></div>
  </footer>
</body>
</html>
